<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b66">
<meta name="robots" content="noindex">
<title>Apuntar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#f4f5f3;--ink:#18211f;--muted:#5c6865;--line:#cfd6d3;--box:#fff;--acc:#0e6b66}
@media (prefers-color-scheme:dark){:root{--bg:#101514;--ink:#e8edeb;--muted:#9ba7a4;--line:#2a3533;--box:#182020}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));max-width:620px;margin-inline:auto}
textarea{flex:1 1 auto;min-height:140px;width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--box);color:inherit;resize:none}
button{flex:none;width:100%;padding:15px;font:inherit;font-weight:600;border:0;border-radius:12px;background:var(--acc);color:#fff}
button:active{opacity:.8}
#m{flex:none;margin:0;min-height:22px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<textarea id="t" placeholder="Apunta lo que sea…" aria-label="Apuntar" autofocus></textarea>
<button id="b" type="button">Apuntar</button>
<p id="m" role="status"></p>
<script>
"use strict";
const COLA = "apuntar-cola", CONF = "apuntar-conf";
const t = document.getElementById("t"), b = document.getElementById("b"), m = document.getElementById("m");
const lee = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch (e) { return d } };
const pon = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
const dos = n => (n < 10 ? "0" : "") + n;
const ahora = () => { const d = new Date(); return d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate()) + " " + dos(d.getHours()) + ":" + dos(d.getMinutes()) };
const borrador = () => pon("apuntar-borrador", t.value);

// La dirección y la clave llegan una sola vez desde el panel privado y se quedan en este aparato.
(function conecta() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("d") && h.get("k")) { pon(CONF, { d: h.get("d"), k: h.get("k") }); history.replaceState(null, "", location.pathname + location.search) }
})();

// Lo que se comparte desde otra app llega aquí.
(function compartido() {
  const q = new URLSearchParams(location.search);
  const a = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean);
  const u = [...new Set(a)].join("\n");
  t.value = u || lee("apuntar-borrador", "");
  if (u) history.replaceState(null, "", location.pathname);
})();

function pinta(txt) {
  const n = lee(COLA, []).length, c = lee(CONF, null);
  if (!c) { m.textContent = "Falta conectar la app: ábrela una vez desde tu panel, con el botón Instalar."; return }
  const p = n ? (n === 1 ? "1 nota sin enviar. " : n + " notas sin enviar. ") + "Se envían cuando abras la app con conexión." : "";
  m.textContent = [txt, p].filter(Boolean).join(" ");
}
let enviando = false;
async function envia() {
  const c = lee(CONF, null); if (enviando || !c) return; enviando = true; let hechas = 0;
  for (;;) {
    const q = lee(COLA, []); if (!q.length) break;
    const n = q[0], ab = new AbortController(), reloj = setTimeout(() => ab.abort(), 25000);
    try {
      const r = await fetch(c.d, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: c.k, f: n.f, t: n.t, id: n.id }), signal: ab.signal });
      const j = await r.json(); clearTimeout(reloj);
      if (!j.ok) { pinta("La clave no vale: vuelve a abrir la app desde tu panel."); enviando = false; return }
      pon(COLA, lee(COLA, []).filter(x => x.id !== n.id)); hechas++;
    } catch (e) { clearTimeout(reloj); pinta(hechas ? "" : "Guardado en el móvil."); enviando = false; return }
  }
  enviando = false; pinta(hechas ? "Enviado." : "");
}
b.addEventListener("click", () => {
  const x = t.value.trim(); if (!x) return;
  pon(COLA, lee(COLA, []).concat([{ f: ahora(), t: x, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) }]));
  t.value = ""; borrador(); pinta("Guardado."); t.focus(); envia();
});
t.addEventListener("input", borrador);
addEventListener("online", envia);
document.addEventListener("visibilitychange", () => { if (!document.hidden) envia() });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
pinta(""); envia();
</script>
</body>
</html>
