<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="robots" content="noindex">
<title>Segundo Cerebro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192-oro.png">
<style>
:root{color-scheme:light dark;--bg:#f4f5f3;--ink:#18211f;--muted:#5c6865;--line:#cfd6d3;--box:#fff;--acc:#e7c44d;--on-acc:#1a1408}
@media (prefers-color-scheme:dark){:root{--bg:#0b0a09;--ink:#efe9dd;--muted:#a39a8b;--line:#2b2620;--box:#151311}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));max-width:620px;margin-inline:auto}
textarea{flex:1 1 auto;min-height:140px;width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--box);color:inherit;resize:none}
button{flex:none;width:100%;padding:15px;font:inherit;font-weight:600;border:0;border-radius:12px;background:var(--acc);color:var(--on-acc)}
button:active{opacity:.8}
#m{flex:none;margin:0;min-height:22px;font-size:14px;color:var(--muted)}
#av{flex:none;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
#av header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
#av header b{font-size:17px}
#ave{font-size:14px;color:var(--muted);text-align:right}
#avl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow:auto}
#avl li{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--box)}
#avl li.va{cursor:pointer}
#avl b{display:block;font-size:15px}
#avl span{display:block;font-size:14px;color:var(--ink);overflow-wrap:anywhere}
#avl small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#avl .nada{border:0;background:none;padding:0;font-size:14px;color:var(--muted)}
#avl .pie{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
#avl .sobra{width:auto;flex:none;padding:5px 12px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted)}
#avl .sobra[disabled]{opacity:.6}
#ver{flex:none;margin:0;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<textarea id="t" placeholder="Apunta lo que sea…" aria-label="Apuntar" autofocus></textarea>
<button id="b" type="button">Apuntar</button>
<p id="m" role="status"></p>
<section id="av" aria-label="Avisos">
  <header><b>Avisos</b><span id="ave" role="status"></span></header>
  <button id="avb" type="button" hidden>Activar avisos</button>
  <ul id="avl"></ul>
</section>
<p id="ver">Versión 8</p>
<script src="cola.js"></script>
<script src="avisos.js"></script>
<script>
"use strict";
const COLA = "apuntar-cola", CONF = "apuntar-conf";
const t = document.getElementById("t"), b = document.getElementById("b"), m = document.getElementById("m");
const lee = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch (e) { return d } };
const pon = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
const dos = n => (n < 10 ? "0" : "") + n;
const ahora = () => { const d = new Date(); return d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate()) + " " + dos(d.getHours()) + ":" + dos(d.getMinutes()) };
const borrador = () => pon("apuntar-borrador", t.value);
const SOLA = "SyncManager" in self;
const CLAVE = "La clave no vale: vuelve a abrir la app desde tu panel.";

// La dirección y la clave llegan una sola vez desde el panel privado y se quedan en este aparato.
(function conecta() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("d") && h.get("k")) { pon(CONF, { d: h.get("d"), k: h.get("k") }); history.replaceState(null, "", location.pathname + location.search) }
})();

// Lo que se comparte desde otra app llega aquí.
(function compartido() {
  const q = new URLSearchParams(location.search);
  const a = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean);
  const u = [...new Set(a)].join("\n");
  t.value = u || lee("apuntar-borrador", "");
  if (u) { borrador(); history.replaceState(null, "", location.pathname) }
})();

// La conexión y las notas de la versión anterior pasan a la base que también lee el servicio de fondo.
async function prepara() {
  try {
    const c = lee(CONF, null); if (c) await Cola.ponConf(c);
    for (const n of lee(COLA, [])) await Cola.pon(n);
    localStorage.removeItem(COLA);
  } catch (e) {}
}

let turno = 0;
const di = x => { turno++; m.textContent = x };
async function pinta(txt) {
  const mio = ++turno; let n = 0, c = null;
  try { n = (await Cola.todas()).length; c = await Cola.conf() } catch (e) {}
  if (mio !== turno) return;
  if (!c) { m.textContent = "Falta conectar la app: ábrela una vez desde tu panel, con el botón Instalar."; return }
  const p = !n ? "" : (n === 1 ? "1 nota sin enviar. Se envía sola" : n + " notas sin enviar. Se envían solas") + (SOLA ? " en cuanto haya conexión, aunque cierres la app." : " al abrir la app con conexión.");
  m.textContent = [txt, p].filter(Boolean).join(" ") || (SOLA ? "Lo que apuntes se envía solo, aunque cierres la app." : "");
}

// El envío lo hace el servicio de fondo, que sigue aunque se cierre la app y espera a que vuelva la conexión.
// Si el aparato no lo permite, envía la propia página.
async function pide() {
  try {
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(no, 4000))]);
    if (!navigator.onLine && (await reg.sync.getTags()).length) return;
    // Un nombre nuevo cada vez: así lo intenta al momento, aunque un intento anterior esté esperando para reintentar.
    await reg.sync.register("enviar-" + Date.now());
  } catch (e) {
    try { const n = await enviaCola(); pinta(n ? "Enviado." : "") }
    catch (e2) { if (e2.clave) di(CLAVE); else pinta("Guardado en el móvil.") }
  }
}
const pendiente = async () => { try { if ((await Cola.todas()).length) pide() } catch (e) {} };

b.addEventListener("click", async () => {
  const x = t.value.trim(); if (!x) return;
  t.value = ""; borrador(); t.focus();
  try { await Cola.pon({ f: ahora(), t: x, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) }) }
  catch (e) { t.value = x; borrador(); di("No se ha podido guardar. Vuelve a pulsar Apuntar."); return }
  const c = await Cola.conf().catch(() => null);
  if (c && navigator.onLine) di("Guardado. Enviando…"); else pinta("Guardado.");
  pide();
});
t.addEventListener("input", borrador);
addEventListener("online", pendiente);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pinta(""); pendiente(); busca() } });
// Busca versión nueva de la app cada vez que se abre o se vuelve a ella (25/11/2026).
const busca = () => { if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {}) };

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", e => {
    const d = e.data || {};
    if (d.aviso) { avisos(""); return }
    if (d.clave) di(CLAVE); else pinta(d.enviado ? "Enviado." : "");
  });
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // Segunda red: si el navegador se rinde tras varios intentos, lo vuelve a probar de vez en cuando.
  navigator.serviceWorker.ready.then(r => r.periodicSync && r.periodicSync.register("enviar", { minInterval: 3600000 })).catch(() => {});
}
// ----- Avisos del Mac (24/11/2026): se activan una vez y llegan aunque la app esté cerrada. -----
const avb = document.getElementById("avb"), ave = document.getElementById("ave"), avl = document.getElementById("avl");
const PUEDE = "serviceWorker" in navigator && "PushManager" in self && "Notification" in self;
const horaAv = ms => { const d = new Date(ms); return dos(d.getDate()) + "/" + dos(d.getMonth() + 1) + " " + dos(d.getHours()) + ":" + dos(d.getMinutes()) };
async function avisos(txt) {
  let s = null;
  if (PUEDE) try { s = await (await navigator.serviceWorker.ready).pushManager.getSubscription() } catch (e) {}
  const perm = PUEDE ? Notification.permission : "denied", activos = !!(s && perm === "granted");
  avb.hidden = !PUEDE || activos || perm === "denied";
  ave.textContent = txt || (!PUEDE ? "Este navegador no deja recibir avisos." : activos ? "Activados" : perm === "denied" ? "Bloqueados en los ajustes del móvil" : "Sin activar");
  let l = [];
  try { l = await Avisos.ultimos(15) } catch (e) {}
  avl.textContent = "";
  if (!l.length) { const li = document.createElement("li"); li.className = "nada"; li.textContent = activos ? "Aún no ha llegado ningún aviso." : ""; if (li.textContent) avl.appendChild(li); return }
  for (const a of l) {
    const li = document.createElement("li"), b = document.createElement("b"), sp = document.createElement("span"), pie = document.createElement("div"), sm = document.createElement("small");
    b.textContent = a.titulo; sp.textContent = a.cuerpo; sm.textContent = horaAv(a.t); pie.className = "pie"; pie.append(sm);
    // «Sobra»: ese aviso deja de llegar (lo recoge el vigilante del Mac por el buzón).
    if (a.clave) {
      const x = document.createElement("button"); x.type = "button"; x.className = "sobra";
      x.textContent = a.sobra ? "Marcado: sobra" : "Sobra"; x.disabled = !!a.sobra;
      x.addEventListener("click", async ev => {
        ev.stopPropagation(); x.disabled = true; x.textContent = "Marcado: sobra";
        try { await Cola.pon(notaSobra(a.clave)); await Avisos.marca(a.n); pide() } catch (e) { x.disabled = false; x.textContent = "Sobra" }
      });
      pie.append(x);
    }
    li.append(b, sp, pie);
    if (a.url) { li.className = "va"; li.addEventListener("click", () => open(a.url, "_blank")) }
    avl.appendChild(li);
  }
}
avb.addEventListener("click", async () => {
  avb.disabled = true;
  try {
    const p = await Notification.requestPermission();
    if (p !== "granted") { avisos(p === "denied" ? "Bloqueados: actívalos en los ajustes del móvil, en esta app." : "Sin activar."); return }
    const reg = await navigator.serviceWorker.ready;
    const s = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytesClave(VAPID) }));
    await Cola.pon(notaAlta(s.toJSON()));
    const c = await Cola.conf().catch(() => null);
    avisos(c ? "Activados. En unos minutos te llega uno de prueba." : "Activados en el móvil. Falta conectar la app: ábrela una vez desde tu panel.");
    pide();
  } catch (e) { avisos("No se han podido activar. Vuelve a pulsar.") }
  finally { avb.disabled = false }
});
prepara().then(() => { pinta(""); pendiente(); avisos(""); busca() });
</script>
</body>
</html>
