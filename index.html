<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6b66">
<meta name="robots" content="noindex">
<title>Apuntar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#f4f5f3;--ink:#18211f;--muted:#5c6865;--line:#cfd6d3;--box:#fff;--acc:#0e6b66}
@media (prefers-color-scheme:dark){:root{--bg:#101514;--ink:#e8edeb;--muted:#9ba7a4;--line:#2a3533;--box:#182020}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;gap:10px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));max-width:620px;margin-inline:auto}
textarea{flex:1 1 auto;min-height:140px;width:100%;padding:12px;font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--box);color:inherit;resize:none}
button{flex:none;width:100%;padding:15px;font:inherit;font-weight:600;border:0;border-radius:12px;background:var(--acc);color:#fff}
button:active{opacity:.8}
#m{flex:none;margin:0;min-height:22px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<textarea id="t" placeholder="Apunta lo que sea…" aria-label="Apuntar" autofocus></textarea>
<button id="b" type="button">Apuntar</button>
<p id="m" role="status"></p>
<script src="cola.js"></script>
<script>
"use strict";
const COLA = "apuntar-cola", CONF = "apuntar-conf";
const t = document.getElementById("t"), b = document.getElementById("b"), m = document.getElementById("m");
const lee = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d } catch (e) { return d } };
const pon = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
const dos = n => (n < 10 ? "0" : "") + n;
const ahora = () => { const d = new Date(); return d.getFullYear() + "-" + dos(d.getMonth() + 1) + "-" + dos(d.getDate()) + " " + dos(d.getHours()) + ":" + dos(d.getMinutes()) };
const borrador = () => pon("apuntar-borrador", t.value);
const SOLA = "SyncManager" in self;
const CLAVE = "La clave no vale: vuelve a abrir la app desde tu panel.";

// La dirección y la clave llegan una sola vez desde el panel privado y se quedan en este aparato.
(function conecta() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("d") && h.get("k")) { pon(CONF, { d: h.get("d"), k: h.get("k") }); history.replaceState(null, "", location.pathname + location.search) }
})();

// Lo que se comparte desde otra app llega aquí.
(function compartido() {
  const q = new URLSearchParams(location.search);
  const a = [q.get("title"), q.get("text"), q.get("url")].filter(Boolean);
  const u = [...new Set(a)].join("\n");
  t.value = u || lee("apuntar-borrador", "");
  if (u) { borrador(); history.replaceState(null, "", location.pathname) }
})();

// La conexión y las notas de la versión anterior pasan a la base que también lee el servicio de fondo.
async function prepara() {
  try {
    const c = lee(CONF, null); if (c) await Cola.ponConf(c);
    for (const n of lee(COLA, [])) await Cola.pon(n);
    localStorage.removeItem(COLA);
  } catch (e) {}
}

let turno = 0;
const di = x => { turno++; m.textContent = x };
async function pinta(txt) {
  const mio = ++turno; let n = 0, c = null;
  try { n = (await Cola.todas()).length; c = await Cola.conf() } catch (e) {}
  if (mio !== turno) return;
  if (!c) { m.textContent = "Falta conectar la app: ábrela una vez desde tu panel, con el botón Instalar."; return }
  const p = !n ? "" : (n === 1 ? "1 nota sin enviar. Se envía sola" : n + " notas sin enviar. Se envían solas") + (SOLA ? " en cuanto haya conexión, aunque cierres la app." : " al abrir la app con conexión.");
  m.textContent = [txt, p].filter(Boolean).join(" ") || (SOLA ? "Lo que apuntes se envía solo, aunque cierres la app." : "");
}

// El envío lo hace el servicio de fondo, que sigue aunque se cierre la app y espera a que vuelva la conexión.
// Si el aparato no lo permite, envía la propia página.
async function pide() {
  try {
    const reg = await Promise.race([navigator.serviceWorker.ready, new Promise((_, no) => setTimeout(no, 4000))]);
    if (!navigator.onLine && (await reg.sync.getTags()).length) return;
    // Un nombre nuevo cada vez: así lo intenta al momento, aunque un intento anterior esté esperando para reintentar.
    await reg.sync.register("enviar-" + Date.now());
  } catch (e) {
    try { const n = await enviaCola(); pinta(n ? "Enviado." : "") }
    catch (e2) { if (e2.clave) di(CLAVE); else pinta("Guardado en el móvil.") }
  }
}
const pendiente = async () => { try { if ((await Cola.todas()).length) pide() } catch (e) {} };

b.addEventListener("click", async () => {
  const x = t.value.trim(); if (!x) return;
  t.value = ""; borrador(); t.focus();
  try { await Cola.pon({ f: ahora(), t: x, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) }) }
  catch (e) { t.value = x; borrador(); di("No se ha podido guardar. Vuelve a pulsar Apuntar."); return }
  const c = await Cola.conf().catch(() => null);
  if (c && navigator.onLine) di("Guardado. Enviando…"); else pinta("Guardado.");
  pide();
});
t.addEventListener("input", borrador);
addEventListener("online", pendiente);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pinta(""); pendiente() } });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", e => {
    const d = e.data || {};
    if (d.clave) di(CLAVE); else pinta(d.enviado ? "Enviado." : "");
  });
  navigator.serviceWorker.register("sw.js").catch(() => {});
  // Segunda red: si el navegador se rinde tras varios intentos, lo vuelve a probar de vez en cuando.
  navigator.serviceWorker.ready.then(r => r.periodicSync && r.periodicSync.register("enviar", { minInterval: 3600000 })).catch(() => {});
}
prepara().then(() => { pinta(""); pendiente() });
</script>
</body>
</html>
